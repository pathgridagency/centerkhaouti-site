      <div><b>CENTRE KHAOUTI</b><small>Espace administration</small></div>
    </div>
    <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="username"></label>
    <label class="field"><span>Mot de passe</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary block" type="submit">Se connecter</button>
    <p class="login-msg"></p>
    <a href="../" class="muted small">← Retour au site</a>
  </form>
</section>

      <svg width="26" height="30" viewBox="0 0 222.44 252.01"><path fill="#f2794f" d="M161.33,22.39c8.25,37.79-46.58,50.81-56.21,13.35-8.25-37.79,46.58-50.81,56.21-13.35Z"/><path fill="#0fa99b" d="M25.12,18.89C9.98,21.13-3.01,41.59.61,57.74c3.1,13.84,17.16,19.05,33.16,30.08,54.82,37.78,76.98,105.59,87.94,139.12,3.39,10.37,7.62,25.39,10.09,25.07C143.5,179.9,80.83,23.57,25.12,18.89Z"/><path fill="#fff" d="M207.27,58.13c9.14,1.81,16.98,18.3,14.8,31.31-1.87,11.15-10.36,15.36-20.02,24.24-33.09,30.45-46.48,85.09-53.1,112.12-2.05,8.36-4.6,20.47-6.09,20.2-6.8-53.16,27.94-181.63,64.41-187.88Z"/></svg>
      <div><b>CENTRE KHAOUTI</b><small>Administration</small></div>

    <nav class="menu">
      <a href="#/">Tableau de bord</a>
      <a href="#/agenda">Agenda</a>

      <span id="who" class="small"></span>
      <button class="btn ghost sm" id="logout">Déconnexion</button>
