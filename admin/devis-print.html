<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Devis — Centre Khaouti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0fa99b;--night:#1d3331;--orange:#f2794f;--muted:#6f7d7b;--line:#d9e3e1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans',sans-serif;color:#24302f;background:#e9eeed;font-size:12.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.bar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;padding:12px;background:var(--night);z-index:5;}
.bar button{font:inherit;font-weight:800;padding:9px 18px;border-radius:9px;border:none;cursor:pointer;background:var(--teal);color:#fff;}
.bar button.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);}
.page{width:210mm;min-height:297mm;margin:20px auto;background:#fff;padding:16mm 16mm 14mm;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.12);position:relative;overflow:hidden;}
.page::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--teal),var(--teal) 70%,var(--orange) 70%);}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:14px;border-bottom:2px solid var(--night);}
.brand{display:flex;gap:12px;align-items:center;}
.brand-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;color:var(--night);letter-spacing:.02em;line-height:1.05;}
.brand-sub{color:var(--teal);font-weight:800;font-size:11.5px;letter-spacing:.05em;margin-top:3px;}
.coords{text-align:right;font-size:11px;line-height:1.6;color:var(--muted);}
.title-row{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 0 18px;gap:20px;}
h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:32px;color:var(--night);letter-spacing:.06em;}
h1 small{display:block;font-size:13px;color:var(--teal);letter-spacing:.02em;font-weight:800;}
.meta{font-size:12px;line-height:1.75;text-align:right;}
.meta b{color:var(--night);}
.client{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:18px;background:#f7faf9;}
.client .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.client .name{font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;color:var(--night);}
.client .det{font-size:11.5px;color:#4b5857;margin-top:3px;line-height:1.6;}
table{width:100%;border-collapse:collapse;}
th{background:var(--night);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;text-align:left;}
th.r,td.r{text-align:right;}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tbody tr:nth-child(even) td{background:#f9fbfb;}
.totals{margin-left:auto;width:78mm;margin-top:12px;}
.totals div{display:flex;justify-content:space-between;padding:5px 10px;}
.totals .grand{background:var(--teal);color:#fff;border-radius:8px;font-weight:900;font-size:15px;padding:9px 12px;margin-top:4px;}
.words{margin-top:16px;font-size:12px;}
.words b{color:var(--night);}
.notes{margin-top:12px;font-size:11.5px;color:#4b5857;white-space:pre-wrap;}
.sign{display:flex;justify-content:flex-end;margin-top:26px;}
.sign-box{width:75mm;text-align:center;}
.sign-box .lbl{font-size:10.5px;color:var(--muted);}
.sign-box .who{font-family:'Nunito',sans-serif;font-weight:900;font-size:14px;color:var(--night);margin-top:2px;letter-spacing:.04em;}
.sign-box .space{height:26mm;border:1px dashed var(--line);border-radius:10px;margin-top:8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9.5px;color:#a5b1af;}
footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:9.5px;color:var(--muted);text-align:center;line-height:1.7;}
footer .thanks{color:var(--teal);font-weight:800;font-size:11px;}
.status-stamp{position:absolute;top:58mm;right:18mm;transform:rotate(-12deg);border:3px solid #d64545;color:#d64545;font-weight:900;font-size:22px;padding:4px 14px;border-radius:8px;letter-spacing:.1em;opacity:.7;}
.msg{text-align:center;padding:60px;font-size:15px;}
@page{size:A4;margin:12mm 14mm;}
@media print{
  body{background:#fff;}
  .bar{display:none;}
  .page{margin:0;box-shadow:none;width:auto;min-height:calc(297mm - 24mm);padding:0 0 0 7mm;}
  thead{display:table-header-group;}
  tr,.totals,.sign,.words{break-inside:avoid;}
}
@media screen and (max-width:820px){ .page{width:100%;min-height:0;padding:20px;} }
</style>
<script src="../assets/js/config.js"></script>
</head>
<body>
<div class="bar"><button onclick="print()">Imprimer / Enregistrer en PDF</button><button class="alt" onclick="close()">Fermer</button></div>
<div id="out"><p class="msg">Chargement du devis…</p></div>

<script type="module">
import { sb, configured, esc, money, fmtDate, amountInWords, devisTotal } from './js/lib.js';

const out = document.getElementById('out');
const fail = m => out.innerHTML = `<p class="msg">${esc(m)}</p>`;
const LOGO = `<svg width="46" height="52" viewBox="0 0 222.44 252.01" xmlns="http://www.w3.org/2000/svg"><path fill="#f2794f" d="M161.33,22.39c8.25,37.79-46.58,50.81-56.21,13.35-8.25-37.79,46.58-50.81,56.21-13.35Z"/><path fill="#0fa99b" d="M25.12,18.89C9.98,21.13-3.01,41.59.61,57.74c3.1,13.84,17.16,19.05,33.16,30.08,54.82,37.78,76.98,105.59,87.94,139.12,3.39,10.37,7.62,25.39,10.09,25.07C143.5,179.9,80.83,23.57,25.12,18.89Z"/><path fill="#1d3331" d="M207.27,58.13c9.14,1.81,16.98,18.3,14.8,31.31-1.87,11.15-10.36,15.36-20.02,24.24-33.09,30.45-46.48,85.09-53.1,112.12-2.05,8.36-4.6,20.47-6.09,20.2-6.8-53.16,27.94-181.63,64.41-187.88Z"/></svg>`;
const qty = n => (+n % 1 ? (+n).toLocaleString('fr-FR') : String(+n));

(async () => {
  if (!configured) return fail('Configuration Supabase manquante.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = './'; return; }
  const id = new URLSearchParams(location.search).get('id');
  const [{ data: d, error }, { data: items }, { data: s }] = await Promise.all([
    sb.from('devis').select('*, patient:patients(*)').eq('id', id).single(),
    sb.from('devis_items').select('*').eq('devis_id', id).order('position'),
    sb.from('settings').select('*').eq('id', 1).single()
  ]);
  if (error || !d) return fail('Devis introuvable.');

  const p = d.patient || {};
  const { sub, total } = devisTotal(items, d.discount, d.tva_rate);
  const afterDiscount = Math.max(sub - d.discount, 0);
  const legal = [['ICE', s.ice], ['IF', s.if_number], ['RC', s.rc], ['ITP', s.patente], ['INPE', s.inpe]]
    .filter(([, v]) => v).map(([k, v]) => `${k} : ${esc(v)}`).join(' · ');
  document.title = `Devis ${d.number} — ${p.full_name || ''}`;

  out.innerHTML = `<div class="page">
    ${d.status === 'cancelled' ? '<div class="status-stamp">ANNULÉ</div>' : ''}
    <header>
      <div class="brand">${LOGO}<div>
        <div class="brand-name">${esc(s.clinic_name.toUpperCase())}</div>
        <div class="brand-sub">${esc(s.clinic_subtitle)}</div></div></div>
      <div class="coords">${esc(s.address)}<br>${s.phone ? 'Tél. ' + esc(s.phone) : ''}${s.email ? '<br>' + esc(s.email) : ''}</div>
    </header>

    <div class="title-row">
      <h1>DEVIS<small>N° ${esc(d.number)}</small></h1>
      <div class="meta">
        Date : <b>${fmtDate(d.issue_date)}</b><br>
        ${d.valid_until ? `Valable jusqu’au : <b>${fmtDate(d.valid_until)}</b><br>` : ''}
        Établi par : <b>${esc(d.issued_by)}</b>
      </div>
    </div>

    <div class="client">
      <div class="lbl">Patient</div>
      <div class="name">${esc(p.full_name || '')}</div>
      <div class="det">${[
        p.cin && `CIN : ${esc(p.cin)}`, p.phone && `Tél. : ${esc(p.phone)}`, p.address && esc(p.address),
        p.insurance && `Couverture : ${esc(p.insurance)}${p.insurance_number ? ' n° ' + esc(p.insurance_number) : ''}`,
        p.referring_doctor && `Médecin prescripteur : ${esc(p.referring_doctor)}`
      ].filter(Boolean).join(' · ')}</div>
    </div>

    <table>
      <thead><tr><th style="width:52%">Désignation</th><th class="r">Qté</th><th class="r">Prix unitaire</th><th class="r">Montant</th></tr></thead>
      <tbody>${items.map(i => `<tr><td>${esc(i.description)}</td><td class="r">${qty(i.quantity)}</td>
        <td class="r">${money(i.unit_price)}</td><td class="r">${money(i.quantity * i.unit_price)}</td></tr>`).join('')}</tbody>
    </table>

    <div class="totals">
      <div><span>Sous-total</span><b>${money(sub)}</b></div>
      ${+d.discount ? `<div><span>Remise</span><b>− ${money(d.discount)}</b></div>` : ''}
      ${+d.tva_rate ? `<div><span>Total HT</span><b>${money(afterDiscount)}</b></div>
                       <div><span>TVA ${+d.tva_rate} %</span><b>${money(total - afterDiscount)}</b></div>` : ''}
      <div class="grand"><span>TOTAL${+d.tva_rate ? ' TTC' : ''}</span><span>${money(total)}</span></div>
    </div>

    <p class="words">Arrêté le présent devis à la somme de : <b>${esc(amountInWords(total))}</b>.</p>
    ${d.notes ? `<p class="notes">${esc(d.notes)}</p>` : ''}

    <div class="sign"><div class="sign-box">
      <div class="lbl">Établi par</div>
      <div class="who">${esc(d.issued_by)}</div>
      <div class="space">Signature et cachet</div>
    </div></div>

    <footer>
      ${s.devis_footer ? `<div class="thanks">${esc(s.devis_footer)}</div>` : ''}
      ${esc(s.clinic_name)} — ${esc(s.address)}${s.phone ? ' — ' + esc(s.phone) : ''}
      ${legal ? '<br>' + legal : ''}
    </footer>
  </div>`;
})().catch(e => fail(e.message));
</script>
</body>
</html>
